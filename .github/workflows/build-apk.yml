name: Build Karimeh Finance Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore and validate Karimeh release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KARIMEH_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KARIMEH_STORE_PASSWORD }}
        run: |
          set -e
          test -n "$KEYSTORE_BASE64"
          test -n "$STORE_PASSWORD"
          echo "$KEYSTORE_BASE64" | base64 --decode > app/karimeh-release.jks
          test -s app/karimeh-release.jks
          keytool -list             -keystore app/karimeh-release.jks             -storepass "$STORE_PASSWORD"             -alias karimeh > /dev/null

      - name: Build signed Release APK
        env:
          KARIMEH_STORE_PASSWORD: ${{ secrets.KARIMEH_STORE_PASSWORD }}
          KARIMEH_KEY_PASSWORD: ${{ secrets.KARIMEH_STORE_PASSWORD }}
          KARIMEH_KEY_ALIAS: karimeh
        run: |
          set -e
          gradle --no-daemon assembleRelease

      - name: Verify Release APK
        run: |
          set -e
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify             --verbose             --print-certs             "$APK"

          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > /tmp/karimeh-badging.txt
          grep -q "package: name='ir.karimeh.finance'" /tmp/karimeh-badging.txt

          if grep -q "application-debuggable" /tmp/karimeh-badging.txt; then
            echo "ERROR: Release APK is marked debuggable."
            exit 1
          fi

          echo "Release APK signature and basic package checks passed."

      - name: Upload final Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Karimeh-Finance-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
