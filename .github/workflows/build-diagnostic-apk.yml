
name: Build Karimeh Diagnostic APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Diagnostic APK
        run: |
          set -e
          gradle --no-daemon assembleDebug

      - name: Verify Diagnostic APK
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"

          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > /tmp/badging.txt

          grep -q "package: name='ir.karimeh.finance.diagnostic'" /tmp/badging.txt

          echo "Diagnostic APK package verified."

      - name: Upload Diagnostic APK
        uses: actions/upload-artifact@v4
        with:
          name: Karimeh-Finance-Diagnostic-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
