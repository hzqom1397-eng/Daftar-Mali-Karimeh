plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'ir.karimeh.finance'
    compileSdk 35

    defaultConfig {
        applicationId 'ir.karimeh.finance'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        release {
            storeFile file("karimeh-release.jks")
            storePassword System.getenv("KARIMEH_STORE_PASSWORD") ?: ""
            keyAlias System.getenv("KARIMEH_KEY_ALIAS") ?: "karimeh"
            keyPassword System.getenv("KARIMEH_KEY_PASSWORD") ?: ""
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}
